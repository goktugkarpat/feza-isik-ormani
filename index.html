<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Işıklı Rüyalar">
<meta name="theme-color" content="#0b1a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Feza ve Pırıl: Işıklı Rüyalar</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a18; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bolum-geri { position: fixed; z-index: 5; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
    width: 78px; height: 78px; padding: 0; display: grid; place-items: center; border: 1px solid #e5d6ff80; border-radius: 50%;
    background: radial-gradient(circle at 38% 28%, #675c92ed, #252044ed 78%); color: #fff3da; cursor: pointer; touch-action: none;
    box-shadow: inset 0 1px 0 #fff8, 0 3px 12px #080b2040; -webkit-tap-highlight-color: transparent; }
  #bolum-geri[hidden] { display: none; }
  #bolum-geri:focus-visible { outline: 3px solid #fff0b8; outline-offset: 4px; }
  #bolum-geri svg { width: 68px; height: 68px; overflow: visible; pointer-events: none; }
  #bolum-geri .geri-halka { fill: none; stroke: #ffe7a4; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transform: rotate(-90deg); transform-origin: 28px 28px; }
  #bolum-geri.basili .geri-halka { animation: geri-bekle 1.2s linear forwards; }
  #bolum-geri.basili { background: radial-gradient(circle at 38% 28%, #8370ae, #3b305d 78%); }
  #bolum-geri .geri-ipucu { position: absolute; right: 0; top: calc(100% + 8px); padding: 7px 11px; border: 1px solid #e5d6ff55; border-radius: 14px;
    background: #211c3af2; color: #fff3da; font: 600 13px/1.3 system-ui, sans-serif; white-space: nowrap; opacity: 0; pointer-events: none; }
  #bolum-geri.basili .geri-ipucu, #bolum-geri:focus-visible .geri-ipucu { opacity: 1; }
  @keyframes geri-bekle { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="bolum-geri" type="button" hidden aria-label="Rüya seçimine dönmek için basılı tut" title="Rüyalara dön · 1,2 saniye basılı tut">
  <svg viewBox="0 0 56 56" aria-hidden="true">
    <circle class="geri-halka" cx="28" cy="28" r="25" pathLength="100"/>
    <path d="M21 18 31 10l10 8v17H29" fill="#d9c4f52b" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M32 35V24h5v11M24 24l-8 8 8 8M17 32h13" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m12 14 1.1 2.8L16 18l-2.9 1.1L12 22l-1.1-2.9L8 18l2.9-1.2Z" fill="#ffe7a4"/>
  </svg>
  <span class="geri-ipucu" aria-hidden="true">Rüyalara dön · basılı tut</span>
</button>
<script>
  // Zayıf ağda ilk açılışta bir kod dosyası yüklenemezse oyun eksik kalır (ör. bulutlar yok → bölüm geçilemez): sayfa bir kez (oturumda en çok 2) kendini yeniler.
  // Seçilen bölüm korunur (oyun.js oturum bayrağını okuyup siler; burada yeniden yazılır).
  addEventListener('error', function (e) {
    var s = e && e.target; if (!s || s.tagName !== 'SCRIPT' || window.__omYenile) return;
    var n = 0; try { n = +(sessionStorage.getItem('fezaYenile') || 0); } catch (x) {}
    if (n >= 2) return;
    window.__omYenile = 1;
    try { sessionStorage.setItem('fezaYenile', String(n + 1)); } catch (x) {}
    setTimeout(function () {   // bölüm bayrağı yenilemeden hemen önce yazılır (oyun.js açılışta okuyup siler)
      try { if (typeof BOLUM_NO !== 'undefined' && BOLUM_NO > 1 && !/[?&]bolum=/.test(location.search)) sessionStorage.setItem('fezaIsikSec', String(BOLUM_NO)); } catch (x) {}
      location.reload();
    }, 1200);
  }, true);
  addEventListener('load', function () { setTimeout(function () { if (!window.__omYenile) try { sessionStorage.removeItem('fezaYenile'); } catch (x) {} }, 3000); });
</script>
<script src="src/ortak.js"></script>
<script src="src/kapi.js"></script>
<script>
  // Bölüm seçimi: ?bolum=N > başlıktan seçim bayrağı (sessionStorage) > 1. Yalnız biri yüklenir (aynı adları tanımlarlar).
  var BOLUM_NO = 1;
  var V5 = { bahce: 0, mini: false, sal: false, final: false };
  try {
    var bq = /[?&]bolum=(\d)/.exec(location.search);
    var bs = bq ? +bq[1] : +(sessionStorage.getItem('fezaIsikSec') || 1);   // başlık sayfası her zaman Bölüm 1; Bölüm 2/3 seçim ekranından (oturum bayrağı + yenileme)
    BOLUM_NO = (bs === 2 || bs === 3 || bs === 4 || bs === 5) ? bs : 1;
  } catch (e) {}
  document.write('<script src="src/' + (BOLUM_NO === 5 ? 'bolum5' : BOLUM_NO === 4 ? 'bolum4' : BOLUM_NO === 3 ? 'bolum3' : BOLUM_NO === 2 ? 'bolum2' : 'bolum') + '.js"><\/script>');
</script>
<script src="src/dunya.js"></script>
<script src="src/feza.js"></script>
<script src="src/piril.js"></script>
<script src="src/pofuduk.js"></script>
<script src="src/sahne.js"></script>
<script src="src/arayuz.js"></script>
<script src="src/sarki.js"></script>
<script src="src/dunya2.js"></script>
<script src="src/yildiz.js"></script>
<script src="src/takim.js"></script>
<script src="src/dunya3.js"></script>
<script src="src/bulut.js"></script>
<script src="src/kuzu.js"></script>
<script src="src/sekil.js"></script>
<script src="src/ucus.js"></script>
<script src="src/dunya4.js"></script>
<script src="src/deniz.js"></script>
<script src="src/inci.js"></script>
<script>
  if (BOLUM_NO === 5) ['dunya5', 'volkan', 'kristal', 'lavsal'].forEach(function(n) {
    document.write('<script src="src/' + n + '.js"><\/script>');
  });
</script>
<script src="src/muzik.js"></script>
<script src="sesler.js"></script>
<script src="src/ses.js"></script>
<script src="src/oyun.js"></script>
<script>
  // iPad'de internetsiz çalışma (file:// ile açılınca atlanır)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
