<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Işıklı Rüyalar">
<meta name="theme-color" content="#0b1a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Feza ve Pırıl: Işıklı Rüyalar</title>
<style>
  html, body { margin: 0; height: 100%; background: #050a18; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // Zayıf ağda ilk açılışta bir kod dosyası yüklenemezse oyun eksik kalır (ör. bulutlar yok → bölüm geçilemez): sayfa bir kez (oturumda en çok 2) kendini yeniler.
  // Seçilen bölüm korunur (oyun.js oturum bayrağını okuyup siler; burada yeniden yazılır).
  addEventListener('error', function (e) {
    var s = e && e.target; if (!s || s.tagName !== 'SCRIPT' || window.__omYenile) return;
    var n = 0; try { n = +(sessionStorage.getItem('fezaYenile') || 0); } catch (x) {}
    if (n >= 2) return;
    window.__omYenile = 1;
    try { sessionStorage.setItem('fezaYenile', String(n + 1)); } catch (x) {}
    setTimeout(function () {   // bölüm bayrağı yenilemeden hemen önce yazılır (oyun.js açılışta okuyup siler)
      try { if (typeof BOLUM_NO !== 'undefined' && BOLUM_NO > 1 && !/[?&]bolum=/.test(location.search)) sessionStorage.setItem('fezaIsikSec', String(BOLUM_NO)); } catch (x) {}
      location.reload();
    }, 1200);
  }, true);
  addEventListener('load', function () { setTimeout(function () { if (!window.__omYenile) try { sessionStorage.removeItem('fezaYenile'); } catch (x) {} }, 3000); });
</script>
<script src="src/ortak.js"></script>
<script>
  // Bölüm seçimi: ?bolum=N > başlıktan seçim bayrağı (sessionStorage) > 1. Yalnız biri yüklenir (aynı adları tanımlarlar).
  var BOLUM_NO = 1;
  try {
    var bq = /[?&]bolum=(\d)/.exec(location.search);
    var bs = bq ? +bq[1] : +(sessionStorage.getItem('fezaIsikSec') || 1);   // başlık sayfası her zaman Bölüm 1; Bölüm 2/3 seçim ekranından (oturum bayrağı + yenileme)
    BOLUM_NO = (bs === 2 || bs === 3) ? bs : 1;
  } catch (e) {}
  document.write('<script src="src/' + (BOLUM_NO === 3 ? 'bolum3' : BOLUM_NO === 2 ? 'bolum2' : 'bolum') + '.js"><\/script>');
</script>
<script src="src/dunya.js"></script>
<script src="src/feza.js"></script>
<script src="src/piril.js"></script>
<script src="src/pofuduk.js"></script>
<script src="src/sahne.js"></script>

<script src="src/dunya3.js"></script>
<script src="src/bulut.js"></script>

<script src="src/ucus.js"></script>

<script src="sesler.js"></script>
<script src="src/ses.js"></script>

<script>
  // iPad'de internetsiz çalışma (file:// ile açılınca atlanır)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

</html>
